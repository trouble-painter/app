name: trouble_painter
description: "A new Flutter project."
publish_to: "none"
version: 2.0.0+33

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  intl: ^0.20.3
  flutter_riverpod: ^3.5.0
  flutter_svg: ^2.4.0
  flutter_secure_storage: ^11.2.0
  talker_flutter: ^5.2.0
  flutter_dotenv: ^6.0.2
  shared_preferences: ^2.5.6
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  firebase_core: ^5.2.0
  go_router: ^18.1.4
  google_sign_in: ^7.2.0
  dio: ^5.11.1
  sign_in_with_apple: ^8.2.0
  text_balancer: ^0.1.7
  flutter_colorpicker: 1.1.0
  path_provider: ^2.1.6
  cloud_firestore: ^7.2.0
  uuid: ^4.6.0
  share_plus: ^13.3.1
  scroll_to_index: 3.0.1
  web_socket_channel: ^3.0.3
  smooth_page_indicator: ^3.0.0
  connectivity_plus: ^7.3.2
  auto_size_text: 3.0.0
  package_info_plus: ^10.2.2
  pinput: ^7.0.0
  jwt_decoder: 2.0.1
  firebase_remote_config: ^7.1.0
  url_launcher: ^6.3.3
  device_preview: ^3.0.0
  lottie: ^3.8.2
  just_audio: ^0.10.6
  firebase_crashlytics: ^6.1.0
  wakelock_plus: ^1.8.2
  store_redirect: 2.0.4
  ntp: 2.0.0
  audio_session: ^0.2.4
  app_links: ^7.2.2
  firebase_analytics: ^13.1.0
  webview_flutter: ^4.14.1
  webview_flutter_wkwebview: ^3.27.2
  qr_flutter: 4.1.0
  permission_handler: ^13.0.2
  app_settings: ^9.0.1
  firebase_messaging: ^17.1.0
  app_badge_plus: ^1.4.0

  material_ui: any
  cupertino_ui: any
  mobile_scanner: ^7.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  flutter_flavorizr: ^2.6.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - lib/.env/dev/.env
    - lib/.env/prod/.env
    - assets/icons/
    - assets/logos/
    - assets/images/
    - assets/images/ko/
    - assets/images/en/
    - assets/lotties/
  fonts:
    - family: pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
    - family: blackHanSans
      fonts:
        - asset: assets/fonts/BlackHanSans-Regular.ttf
          weight: 400
    - family: rubik
      fonts:
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500

flutter_intl:
  enabled: true
  arb_dir: lib/core/localization/l10n
  output_dir: lib/core/localization/generated
  main_locale: ko
